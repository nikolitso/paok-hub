<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --surface-2: #ececea;
    --ink: #16171a;
    --ink-dim: #55585f;
    --line: #d9d9d5;
    --accent: #1c1f6b;
    --accent-soft: #e7e8f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114;
      --surface: #17181c;
      --surface-2: #1d1f24;
      --ink: #edeeef;
      --ink-dim: #9a9ca3;
      --line: #2b2d33;
      --accent: #8f96ff;
      --accent-soft: #232650;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114;
    --surface: #17181c;
    --surface-2: #1d1f24;
    --ink: #edeeef;
    --ink-dim: #9a9ca3;
    --line: #2b2d33;
    --accent: #8f96ff;
    --accent-soft: #232650;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 24px 96px; }
  .site-head { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .site-logo {
    width: 52px; height: auto; flex: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 0 0 4px;
  }
  .site-head h1 {
    font-family: "Archivo", ui-sans-serif, sans-serif;
    font-weight: 800; font-size: clamp(24px, 3.6vw, 32px);
    letter-spacing: -0.01em; margin: 0;
  }
  .sub { color: var(--ink-dim); font-size: 15.5px; max-width: 60ch; margin: 0 0 40px; }
  .section-head {
    margin: 40px 0 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 600;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); text-decoration: none; color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent); outline: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-1px);
  }
  :root[data-theme="dark"] .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  }
  .card .name { font-weight: 600; font-size: 14.5px; }
  .card .desc { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .card .go { flex: none; font-family: "IBM Plex Mono", monospace; color: var(--ink-dim); font-size: 12.5px; }
  footer.page-foot {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-dim);
  }
</style>
</head>
